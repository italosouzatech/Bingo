<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Bingo</title>
<style>
:root{--bg:#f4f6fb;--fg:#14171f;--sf:#fff;--sf2:#e9edf5;--ac:#2563eb;--hit:#16a34a;--cur:#f59e0b;--mut:#667085;--bd:#d5dae4}
@media (prefers-color-scheme:dark){:root{--bg:#0b1020;--fg:#f1f4fa;--sf:#151c30;--sf2:#1e2740;--ac:#5b8def;--hit:#22c55e;--mut:#9aa6bd;--bd:#2b3654}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:1100px;margin:0 auto;padding:max(12px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom))}
#app.pubmode{max-width:none;padding:0}
button{font:inherit;cursor:pointer}
.btn{padding:14px 18px;border:0;border-radius:14px;background:var(--ac);color:#fff;font-size:19px;font-weight:700;width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sec{background:var(--sf);color:var(--fg);border:1px solid var(--bd);font-size:15px;font-weight:600;padding:11px 14px;width:auto}
.btn.wide{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>.btn{flex:1}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.top h2{margin:0;font-size:clamp(17px,3vw,24px);flex:1}
.top span{font-weight:700;color:var(--mut)}
.menu{max-width:520px;margin:6vh auto 0;display:grid;gap:12px}
.menu h1{margin:0;font-size:40px;text-align:center}
.sub,.note,.hist,small{color:var(--mut)}.sub{text-align:center;margin:0 0 6px}
.note{text-align:center;font-size:13px;margin-top:8px}
.opt{display:flex;flex-direction:column;gap:4px;text-align:left;padding:18px;border-radius:16px;border:1px solid var(--bd);background:var(--sf);color:var(--fg)}
.opt b{font-size:20px}.opt span{color:var(--mut);font-size:14px}
.opt:hover{border-color:var(--ac)}
.draw{display:grid;gap:16px}
@media (min-width:860px){.draw{grid-template-columns:minmax(330px,400px) 1fr;align-items:start}}
.left{display:grid;gap:10px}
.cur{text-align:center;background:var(--sf);border:1px solid var(--bd);border-radius:20px;padding:14px}
.cur .l{font-size:30px;font-weight:800;color:var(--ac);min-height:36px}
.cur .n{font-size:clamp(84px,26vw,150px);font-weight:900;line-height:1}
.board{display:grid;grid-template-columns:repeat(10,1fr);gap:clamp(3px,.7vw,8px)}
.board div{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:10px;background:var(--sf2);color:var(--mut);font-weight:700;font-size:clamp(12px,2.3vw,21px)}
.board div.d{background:var(--hit);color:#fff}
.board div.c{background:var(--cur);color:#111;outline:3px solid var(--fg)}
.hist{margin-top:10px;font-size:15px}
.prt,.chk{max-width:560px;margin:0 auto;display:grid;gap:14px}
.seg{display:flex;gap:8px}.seg button{flex:1;padding:14px;border-radius:12px;border:2px solid var(--bd);background:var(--sf);color:var(--fg);font-weight:700}
.seg button.on{border-color:var(--ac);background:var(--ac);color:#fff}
input[type=number]{padding:10px;font-size:20px;width:110px;border:1px solid var(--bd);border-radius:10px;background:var(--sf);color:var(--fg)}
label{font-weight:600}
.msg{font-size:20px;font-weight:800}.msg.ok{color:var(--hit)}
table.c{border-collapse:collapse;width:100%;table-layout:fixed;background:#fff;color:#000;max-width:460px}
table.c th{background:#2563eb;color:#fff;padding:8px;font-size:22px}
table.c td{border:1px solid #444;text-align:center;height:clamp(48px,11vw,72px);font-size:clamp(22px,5vw,32px);font-weight:700}
table.c td.f{background:#e5e7eb;font-size:14px}
table.c td.m{background:#16a34a;color:#fff}
/* tela do público (projetor / TV) */
.pub{background:#050816;color:#fff;height:100vh;height:100dvh;display:grid;grid-template-rows:36% 1fr;gap:2vmin;padding:2.5vmin;cursor:pointer;user-select:none}
.pub.w{display:flex;align-items:center;justify-content:center;font-size:30vmin}
.pn{display:flex;flex-direction:column;align-items:center;justify-content:center;background:#111a33;border-radius:3vmin;min-height:0}
.pl{font-size:min(12vw,10vh);color:#fbbf24;font-weight:800;line-height:1}
.pv{font-size:min(34vw,26vh);font-weight:900;line-height:1}
.pb{display:grid;grid-template-columns:repeat(10,1fr);grid-auto-rows:1fr;gap:1vmin;min-height:0}
.pb div{display:flex;align-items:center;justify-content:center;border-radius:1vmin;background:#0f172a;color:#2f3b57;font-weight:800;font-size:3.4vmin}
.pub.n100 .pb div{font-size:2.5vmin}
.pb .d{background:#2563eb;color:#fff}.pb .c{background:#f59e0b;color:#111}
@media (orientation:landscape){.pub{grid-template-rows:1fr;grid-template-columns:36% 1fr}.pl{font-size:min(7vw,14vh)}.pv{font-size:min(17vw,40vh)}}
.xit{position:fixed;top:0;left:0;width:64px;height:64px}
</style>
</head>
<body>
<div id="app"></div>
<script src="/src/index.js"></script>
</body>
</html>
